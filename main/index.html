<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bloxd.io Proxy</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    .loader-container {
      text-align: center;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 5px solid rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      border-top-color: #38bdf8;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 8px;
    }
    p {
      color: #94a3b8;
      font-size: 0.95rem;
    }
  </style>
  <script src="/uv/uv.bundle.js"></script>
  <script src="/uv/uv.config.js"></script>
</head>
<body>
  <div class="loader-container">
    <div class="spinner"></div>
    <h1>Connecting to Bloxd.io...</h1>
    <p id="status">Initializing proxy connection...</p>
  </div>

  <script>
    (async () => {
      const status = document.getElementById('status');
      
      if (!('serviceWorker' in navigator)) {
        status.textContent = 'Service Worker is not supported by your browser.';
        return;
      }

      try {
        status.textContent = 'Registering Service Worker...';
        await navigator.serviceWorker.register('/arc-sw.js', {
          scope: __uv$config.prefix
        });
        
        status.textContent = 'Redirecting to Bloxd.io...';
        
        const path = window.location.pathname === '/' ? '' : window.location.pathname;
        const targetUrl = 'https://bloxd.io' + path + window.location.search + window.location.hash;
        
        const proxyUrl = __uv$config.prefix + __uv$config.encodeUrl(targetUrl);
        window.location.replace(proxyUrl);
      } catch (err) {
        console.error('Failed to initialize proxy:', err);
        status.textContent = 'Failed to connect: ' + err.message;
      }
    })();
  </script>
</body>
</html>
